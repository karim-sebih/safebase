services:
   mysql:
      image: mysql:8.4
      container_name: safebase_mysql
      command: --mysql-native-password=ON
      environment:
         MYSQL_DATABASE: safebase
         MYSQL_USER: myuser
         MYSQL_PASSWORD: mypassword
         MYSQL_ROOT_PASSWORD: root
      ports:
         - "3307:3306"
      volumes:
         - ./mysql-data:/var/lib/mysql
         - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      healthcheck:
         test:
            ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
         interval: 5s
         timeout: 5s
         retries: 20
         start_period: 10s

   back:
      build:
         context: ./back
      container_name: safebase_back
      environment:
         DB_NAME: safebase
         DB_USER: myuser
         DB_PASSWORD: mypassword
         DB_HOST: mysql
         DB_PORT: 3306
         PORT: 3000
      ports:
         - "3000:3000"
      volumes:
         - ./back:/app
         - /app/node_modules
      command: npm run dev
      depends_on:
         mysql:
            condition: service_healthy

   front:
      build:
         context: ./front
      container_name: safebase_front
      environment:
         CHOKIDAR_USEPOLLING: "true"
      ports:
         - "5173:5173"
      volumes:
         - ./front:/app
         - /app/node_modules
      command: npm run dev -- --host 0.0.0.0
      depends_on:
         - back
